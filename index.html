<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f4" />
    <link rel="canonical" href="https://jamal-haji.vercel.app/" />

    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('jamal-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          if (dark) root.classList.add('dark')
          root.style.colorScheme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#191513' : '#faf8f4')
        } catch (e) {}
      })()
    </script>

    <title>Jamal Haji | Graphic & Creative Designer</title>
    <meta
      name="description"
      content="Jamal Haji is a graphic and creative designer who transforms ideas into visually appealing brand identities, logos, graphics and creative experiences."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Jamal Haji" />
    <meta
      name="keywords"
      content="Jamal Haji, graphic designer, creative designer, brand identity, logo design, social media design, marketing design, portfolio"
    />
    <meta name="google-site-verification" content="i1jTxMqt3cmov8ki3oZM-jyA5e7aGHNY3iiHyPzi8dA" />
